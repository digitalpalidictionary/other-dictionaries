[project]
name = "other-dictionaries"
version = "1.0.0"
description = "Auxiliary dictionary exporters for Pāḷi, Sanskrit, and Sinhala"
authors = [{ name = "Digital Pāḷi Dictionary", email = "digitalpalidictionary@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "rich>=13.3.1",
    "natsort>=8.4.0",
    "aksharamukha>=2.1.2",
    "pyglossary>=4.6.1",
    "beautifulsoup4>=4.11.2",
    "python-idzip>=0.3.9",
    "jinja2>=3.1.0",
    "httpx>=0.28.1",
    "tqdm>=4.67.3",
    "selenium>=4.20.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "ruff>=0.9.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendor", "scripts", "tests"]

[tool.hatch.build.targets.sdist]
include = ["vendor", "scripts", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
exclude = [
    "vendor/dpd_tools/writemdict/*",
]

[tool.ruff.lint]
ignore = ["E501"]
