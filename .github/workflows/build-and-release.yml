name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'dictionaries/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install dependencies
        run: uv sync

      - name: Decompress sources and build dictionaries
        run: uv run python scripts/export_all.py

      - name: Verify build outputs exist
        run: |
          if [ ! -d "./build/goldendict" ] || [ ! -d "./build/mdict" ]; then
            echo "Error: Build directories not found"
            exit 1
          fi
          GD_COUNT=$(ls ./build/goldendict/*.zip 2>/dev/null | wc -l)
          MD_COUNT=$(ls ./build/mdict/*.zip 2>/dev/null | wc -l)
          echo "GoldenDict zips: $GD_COUNT"
          echo "MDict zips: $MD_COUNT"
          if [ "$GD_COUNT" -eq 0 ] && [ "$MD_COUNT" -eq 0 ]; then
            echo "Error: No dictionary zip files found"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Rename individual dictionary files with -gd and -mdict suffixes
          for zip in build/goldendict/*.zip; do
            basename=$(basename "$zip" .zip)
            cp "$zip" "release-assets/${basename}-gd.zip"
          done
          
          for zip in build/mdict/*.zip; do
            basename=$(basename "$zip" .zip)
            cp "$zip" "release-assets/${basename}-mdict.zip"
          done
          
          # Create combined archives (flat structure)
          cd build/goldendict
          zip -r ../../release-assets/all-dictionaries-gd.zip *.zip
          cd ../mdict
          zip -r ../../release-assets/all-dictionaries-mdict.zip *.zip
          cd ../..
          
          echo "Release assets prepared:"
          ls -la release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-zips
          path: |
            ./release-assets/*.zip
          retention-days: 7

      - name: Get next version
        id: version
        run: |
          uv run python scripts/version.py >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "Automated release of dictionary files" \
            ./release-assets/*.zip

      - name: Update existing release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.check_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Release $VERSION already exists. Uploading new assets..."
          gh release upload "$VERSION" ./release-assets/*.zip --clobber
