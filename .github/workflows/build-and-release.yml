name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'dictionaries/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install dependencies
        run: uv sync
        working-directory: resources/other-dictionaries

      - name: Decompress sources and build dictionaries
        run: uv run python scripts/export_all.py
        working-directory: resources/other-dictionaries

      - name: Get next version
        id: version
        run: |
          uv run python scripts/version.py >> $GITHUB_OUTPUT
        working-directory: resources/other-dictionaries

      - name: Create release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "Automated release of dictionary files" \
            ./build/goldendict/*.zip \
            ./build/mdict/*.zip
        working-directory: resources/other-dictionaries
